name: release
# Builds gpkg_merger-<version>.zip and publishes a GitHub release v<version>.
# The release notes are the "## <version>" section of CHANGELOG.md; the job
# fails if that section is missing.
# Start it from Actions ▸ release ▸ "Run workflow", by pushing a tag v*,
# or by publishing a release in the GitHub web page.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  release:
    types: [published]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: read version
        id: meta
        run: echo "version=$(grep -m1 '^version=' gpkg_merger/metadata.txt | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - name: release notes from CHANGELOG.md
        run: python3 scripts/release_notes.py "${{ steps.meta.outputs.version }}" > release_notes.md
      - run: python3 scripts/package.py
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: GPKG Merger ${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release_notes.md
          files: dist/*.zip
