name: tests
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    name: GDAL tests + translations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: install GDAL and Qt tools
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends python3-gdal qttools5-dev-tools
      - name: unit tests
        run: python3 -m unittest discover -s tests -v
      - name: translations up to date
        run: python3 scripts/build_i18n.py && git diff --exit-code -- gpkg_merger/i18n/*.ts

  windows:
    name: Windows – merge engine (GDAL from conda-forge)
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash -el {0}  # activates the micromamba environment
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: gpkg
          create-args: >-
            -c conda-forge
            python=3.12
            gdal
          init-shell: bash
      - name: versions
        run: |
          python -c "import sqlite3; print('sqlite', sqlite3.sqlite_version, [o for (o,) in sqlite3.connect(':memory:').execute('PRAGMA compile_options') if 'URI' in o])"
          python -c "from osgeo import gdal; print('GDAL', gdal.__version__)"
      - name: unit tests
        run: python -m unittest discover -s tests -v

  qgis4:
    name: QGIS 4 (Qt6) – PyQGIS 4 checker + plugin tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/qgis/pyqgis4-checker:main-ubuntu
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: versions
        run: |
          qgis --version || true
          python3 -c "from qgis.core import Qgis; from qgis.PyQt.QtCore import QT_VERSION_STR; print('QGIS', Qgis.version(), 'Qt', QT_VERSION_STR)"
      - name: PyQGIS 4 migration check
        run: |
          pyqt5_to_pyqt6.py --dry_run --logfile pyqt6_checker.log gpkg_merger/
          cat pyqt6_checker.log || true
          # fails if anything would need to be changed
          pyqt5_to_pyqt6.py gpkg_merger/
          git diff --exit-code -- gpkg_merger/
      - name: plugin tests inside QGIS 4
        run: python3 -m unittest discover -s tests -v
